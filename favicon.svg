<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Midnight Apps">
  <title>Midnight Apps</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2350"/>
      <stop offset="0.55" stop-color="#111838"/>
      <stop offset="1" stop-color="#0a0e22"/>
    </linearGradient>
    <linearGradient id="moon" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9d4ff"/>
      <stop offset="1" stop-color="#a98bff"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="64" height="64" fill="#000"/>
      <circle cx="35" cy="32" r="16" fill="#fff"/>
      <circle cx="25.5" cy="26.5" r="14.5" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none"
        stroke="#6e8bff" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect width="64" height="64" rx="15" fill="url(#moon)" mask="url(#crescent)"/>
  <circle cx="18" cy="45" r="1.7" fill="#c9d4ff" fill-opacity="0.9"/>
  <circle cx="46.5" cy="16" r="1.3" fill="#c9d4ff" fill-opacity="0.75"/>
  <circle cx="14.5" cy="20" r="1" fill="#c9d4ff" fill-opacity="0.6"/>
</svg>
